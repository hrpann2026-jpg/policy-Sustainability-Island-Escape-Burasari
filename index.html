<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>นโยบายความยั่งยืน | Island Escape Burasari</title>
<style>
:root{--bg:#faf8f3;--card:#fff;--tx:#1d2a44;--mu:#6b7280;--ac:#b79a5b;--ln:#e8e2d3;--nv:#1d2a44;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121826;--card:#1a2236;--tx:#eef0f5;--mu:#9aa3b5;--ln:#2b3550;--nv:#0c1220;--on:#fff}}
:root[data-theme=dark]{--bg:#121826;--card:#1a2236;--tx:#eef0f5;--mu:#9aa3b5;--ln:#2b3550;--nv:#0c1220;--on:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;line-height:1.6}
header{background:var(--nv);color:var(--on);padding:28px 20px 24px;text-align:center}
header small{letter-spacing:.3em;color:var(--ac);font-size:12px}
header h1{margin:6px 0 4px;font-size:clamp(22px,5vw,32px)}header p{margin:0;opacity:.8;font-size:14px}
main{max-width:1060px;margin:0 auto;padding:18px 14px 60px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
input{flex:1 1 200px;padding:10px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 13px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.st{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;text-align:center}
.st b{display:block;font-size:22px;color:var(--ac)}.st span{font-size:12px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cd{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:.15s}
.cd:hover{transform:translateY(-2px);border-color:var(--ac)}
.cd .ic{font-size:28px}.cd h3{margin:6px 0 4px;font-size:16px}.cd p{margin:0;font-size:13px;color:var(--mu)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--ln);margin-top:8px}
dialog{border:none;border-radius:16px;padding:0;max-width:640px;width:calc(100% - 24px);background:var(--card);color:var(--tx);max-height:88vh}
dialog::backdrop{background:#0008}
.dh{padding:18px 20px;background:var(--nv);color:var(--on);display:flex;justify-content:space-between;gap:10px;align-items:start}
.dh h2{margin:0;font-size:18px}.dh button{background:none;border:0;color:var(--on);font-size:24px;cursor:pointer}
.db{padding:16px 20px 22px;overflow:auto;max-height:70vh}
.db h4{margin:16px 0 6px;color:var(--ac)}.db ul{margin:0;padding-left:20px}.db li{margin:3px 0}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs .chip{flex:1}
.do{background:var(--bg);border-left:4px solid var(--ac);padding:10px 12px;border-radius:8px;margin-top:14px;font-size:14px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:20px}
@media print{.bar,header small{display:none}}
</style></head><body>
<header><button id="lg" class="chip" style="float:right">EN</button><small>ISLAND ESCAPE · BURASARI</small><h1 id="h1"></h1><p id="hp"></p></header>
<main>
<div class="hero">
<div class="st"><b>12</b><span>นโยบาย</span></div>
<div class="st"><b>2590</b><span>เป้าหมายคาร์บอนนิวทรัล</span></div>
<div class="st"><b>2593</b><span>เป้าหมาย Net Zero</span></div>
<div class="st"><b>10%</b><span>ลดพลังงานภายใน 2578</span></div>
</div>
<div class="bar"><input id="q" placeholder="ค้นหานโยบาย เช่น น้ำ ขยะ ซ้อมหนีไฟ…" aria-label="ค้นหา"><span id="f" style="display:contents"></span></div>
<div class="grid" id="g"></div>
</main>
<footer id="ft"></footer>
<dialog id="m"><div class="dh"><h2 id="mt"></h2><button onclick="m.close()" aria-label="ปิด">×</button></div><div class="db" id="mb"></div></dialog>
